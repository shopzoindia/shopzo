<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopzo - Add Product</title>
  <link rel="stylesheet" href="admin.css">
</head>

<body>

<header class="header">
  <div class="brand">🛍️ Shopzo</div>
  <div class="subtitle">Product Manager</div>
</header>

<main class="container">

  <section class="form-card">
    <h1>➕ Add New Product</h1>
    <p class="help">Product ki details bhar kar website par list karo.</p>

    <label>Product Image</label>
    <input type="file" id="productImage" accept="image/*">

    <img id="imagePreview" class="preview" alt="Preview">

    <label>Product Name</label>
    <input type="text" id="productName" placeholder="Example: Stylish Ladies Kurti">

    <div class="two-column">
      <div>
        <label>Selling Price</label>
        <input type="number" id="sellingPrice" placeholder="399">
      </div>

      <div>
        <label>Old Price</label>
        <input type="number" id="oldPrice" placeholder="799">
      </div>
    </div>

    <div class="two-column">
      <div>
        <label>Discount %</label>
        <input type="number" id="discount" placeholder="50">
      </div>

      <div>
        <label>Rating</label>
        <input type="number" id="rating" min="0" max="5" step="0.1" placeholder="4.2">
      </div>
    </div>

    <label>Category</label>
    <select id="category">
      <option value="Fashion">Fashion</option>
      <option value="Electronics">Electronics</option>
      <option value="Beauty">Beauty</option>
      <option value="Footwear">Footwear</option>
      <option value="Home">Home</option>
      <option value="Kids & Toys">Kids & Toys</option>
      <option value="Other">Other</option>
    </select>

    <label>Product Description</label>
    <textarea id="description" placeholder="Product ke baare me likho..."></textarea>

    <button id="listProductBtn" class="primary-btn">
      LIST PRODUCT
    </button>
  </section>


  <section class="list-card">
    <div class="list-heading">
      <div>
        <h2>📦 Listed Products</h2>
        <p id="productCount">0 Products</p>
      </div>
    </div>

    <div id="productList" class="product-list"></div>
  </section>

</main>

<script src="admin.js"></script>
</body>
          </html>
