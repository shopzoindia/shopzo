<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopzo</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="app">

<header class="topbar">
  <div class="brand">
    <div class="logo">🙏</div>
    <div>
      <div class="hello">Hello,</div>
      <div class="lets">Let's shop!</div>
    </div>
  </div>

  <div class="top-actions">
    <span class="lang">अ<br>A</span>
    <button>♡</button>
    <button>🛒</button>
  </div>
</header>

<div class="search-area">
  <div class="search-box">
    <span class="search-icon">⌕</span>
    <input id="searchInput" placeholder="Search by Keyword or Product ID">
    <span>🎙️</span>
    <span>📷</span>
  </div>
</div>

<section class="benefits">
  <div>
    <span>📦</span>
    <p><b>7 Days</b><small>Easy Return</small></p>
  </div>

  <div>
    <span>💵</span>
    <p><b>Cash on</b><small>Delivery</small></p>
  </div>

  <div>
    <span>🏷️</span>
    <p><b>Lowest</b><small>Price</small></p>
  </div>
</section>

<section class="categories section">
  <div class="heading">
    <h2>Categories</h2>
  </div>

  <div class="category-row">
    <div class="cat"><i>▦</i><span>Categories</span></div>
    <div class="cat"><i>👗</i><span>Kurti & Dress</span></div>
    <div class="cat"><i>🧸</i><span>Kids & Toys</span></div>
    <div class="cat"><i>👚</i><span>Western Wear</span></div>
    <div class="cat"><i>💄</i><span>Beauty</span></div>
    <div class="cat"><i>👟</i><span>Footwear</span></div>
  </div>
</section>

<section class="recent section">
  <div class="heading">
    <h2>Recently Viewed</h2>
  </div>

  <div class="recent-row">
    <div class="recent-card">
      <img src="https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&w=600&q=80">
      <span>Fridge Covers</span>
    </div>

    <div class="recent-card">
      <img src="https://images.unsplash.com/photo-1611652022419-a9419f74343d?auto=format&fit=crop&w=600&q=80">
      <span>Bangles & Bracelets</span>
    </div>

    <div class="recent-card">
      <img src="https://images.unsplash.com/photo-1583743814966-8936f37f4678?auto=format&fit=crop&w=600&q=80">
      <span>Black Fashion</span>
    </div>
  </div>
</section>

<div class="filter-bar">
  <button>↕ Sort</button>
  <button>Category⌄</button>
  <button>Gender⌄</button>
  <button>☷ Filters</button>
</div>

<section class="products section">
  <div id="products" class="product-grid"></div>
</section>

<nav class="bottom-nav">
  <button class="nav-item active" data-page="home">
    <span class="nav-icon">⌂</span>
    <span>Home</span>
  </button>

  <button class="nav-item" data-page="categories">
    <span class="nav-icon">▦</span>
    <span>Categories</span>
  </button>

  <button class="nav-item" data-page="orders">
    <span class="nav-icon">▢</span>
    <span>My Orders</span>
  </button>

  <button class="nav-item" data-page="help">
    <span class="nav-icon">?</span>
    <span>Help</span>
  </button>

  <button class="nav-item" data-page="account">
    <span class="nav-icon">◯</span>
    <span>Account</span>
  </button>
                                                  </nav>

</div>

<script src="script.js"></script>
</body>
                       </html>
