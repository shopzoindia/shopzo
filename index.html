<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHOPZO - Online Shopping</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top">

  <div class="hello">
    <div class="hello-icon">🙏</div>

    <div>
      <div>Hello,</div>
      <strong>Let's shop!</strong>
    </div>
  </div>

  <div class="header-actions">
    <button>♡</button>
    <button>🛒</button>
  </div>


  <section class="sale-banner">

    <div>
      <h1>SHOPZO</h1>
      <h2>MEGA SAVINGS SALE</h2>
      <b>UP TO 70% OFF</b>
    </div>

    <span>⚡</span>

  </section>


  <div class="search">

    <span>⌕</span>

    <input
      id="searchInput"
      type="search"
      placeholder="Search by Keyword or Product"
    >

    <span>🎤</span>
    <span>📷</span>

  </div>

</header>


<section class="benefits">

  <div>
    📦
    <span>
      <b>7 Days</b>
      <small>Easy Return</small>
    </span>
  </div>

  <div>
    💵
    <span>
      <b>Cash on</b>
      <small>Delivery</small>
    </span>
  </div>

  <div>
    🏷️
    <span>
      <b>Lowest</b>
      <small>Price</small>
    </span>
  </div>

</section>


<main>

  <section class="section">

    <div class="section-title">
      <h2>Shop by Category</h2>
      <a href="#">View All</a>
    </div>

    <div class="categories" id="categories"></div>

  </section>


  <!-- REAL PRODUCTS WILL APPEAR HERE -->

  <section class="offer">

    <div class="offer-title">
      ✨ OFFER ZONE ✨
    </div>

    <div
      class="offer-grid"
      id="offer-products">
    </div>

  </section>


  <section class="section">

    <div class="section-title">

      <div>
        <h2>Flash Sale ⚡</h2>
      </div>

      <a href="#">VIEW ALL ›</a>

    </div>

    <div
      class="flash-grid"
      id="flashProducts">
    </div>

  </section>

</main>


<nav class="bottom-nav">

  <a class="active" href="#">
    ⌂
    <span>Home</span>
  </a>

  <a href="#">
    👕
    <span>Categories</span>
  </a>

  <a href="#">
    📦
    <span>My Orders</span>
  </a>

  <a href="#">
    ❓
    <span>Help</span>
  </a>

  <a href="#">
    😎
    <span>Account</span>
  </a>

</nav>


<script src="script.js"></script>

</body>
</html>
